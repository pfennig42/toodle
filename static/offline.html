<!doctype html>
<html lang="de">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#2f6b4f" />
		<title>Offline · toodle</title>
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f5f0;
				--surface: #fffdf9;
				--border: #ddd8ce;
				--text: #1e2a24;
				--muted: #5d635f;
				--accent: #2f6b4f;
				--accent-text: #fff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #171a18;
					--surface: #202421;
					--border: #3a403b;
					--text: #ecebe6;
					--muted: #a5aaa6;
					--accent: #7fc29b;
					--accent-text: #10241a;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 1rem;
				box-sizing: border-box;
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
				line-height: 1.5;
			}
			main {
				max-width: 26rem;
				padding: 1.5rem;
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 0.6rem;
			}
			img {
				width: 3rem;
				height: 3rem;
			}
			h1 {
				font-size: 1.3rem;
				margin: 0.75rem 0 0.5rem;
			}
			p {
				margin: 0 0 0.75rem;
			}
			.muted {
				color: var(--muted);
				font-size: 0.9rem;
			}
			button {
				min-height: 2.75rem;
				padding: 0 1.1rem;
				border: 0;
				border-radius: 0.6rem;
				background: var(--accent);
				color: var(--accent-text);
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/favicon.svg" alt="" />
			<h1>Du bist offline</h1>
			<p>
				Diese Seite ist ohne Verbindung nicht verfügbar. Deine Veranstaltungen und Mitfahrten, die
				du schon einmal geöffnet hast, kannst du weiter ansehen.
			</p>
			<p class="muted" lang="en">
				You're offline. Events and rides you opened before are still available.
			</p>
			<button type="button" onclick="location.reload()">Erneut versuchen · Retry</button>
		</main>
	</body>
</html>
