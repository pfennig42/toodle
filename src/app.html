<!doctype html>
<html lang="%paraglide.lang%" dir="%paraglide.dir%" data-theme="%toodle.theme%">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#f7f5f0" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#171a18" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icons/favicon.svg" type="image/svg+xml" />
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			sizes="32x32"
			type="image/png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
